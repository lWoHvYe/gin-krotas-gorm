// api/user.proto
syntax = "proto3";

package user.v1;

import "google/api/annotations.proto";

option go_package = "helloworld-go/api/user/v1;v1";
option java_multiple_files = true;
option java_package = "dev.kratos.api.user.v1";
option java_outer_classname = "UserProtoV1";

service User {
  rpc Register (RegisterRequest) returns (UserReply) {
    option (google.api.http) = {
      post: "/v1/users"
      body: "*"
    };
  }

  rpc GetByID (SingleIDRequest) returns (UserReply) {
    option (google.api.http) = {
      get: "/v1/users/{id}"
    };
  }

  rpc UpdateRoleByID (UpdateRoleRequest) returns (SimpleResponse) {
    option (google.api.http) = {
      put: "/v1/users/{id}/role"
      body: "*"
    };
  }
}

message RegisterRequest {
  string name = 1;
}

message SingleIDRequest {
  int64 id = 1;
}

message UpdateRoleRequest {
  int64 id = 1;
  string role_name = 2;
}

message SimpleResponse {
  string msg = 1;
}

message UserReply {
  int64 id = 1;
  string name = 2;
  string role_name = 3;
}